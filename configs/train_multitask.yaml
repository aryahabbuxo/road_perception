run_name: 20261103_multitask_main
data_root: /content/data
# streetsurface and rtk: road-surface datasets from Person B (surface labels only)
datasets: [speedbump, rdd, bdd, idd, streetsurface, rtk]
tasks: [det, seg, depth, surface, lean]
loss_weighting: uncertainty
p_lean: 0.5          # share of images tilted to teach the lean head
p_vibration: 0.5     # share of images given handlebar shake + blur (Person B's augmentation)
pretrained: yolo11s.pt
epochs: 40
batch: 16
lr_body: 0.0001
lr_heads: 0.001
lr_log_vars: 0.01
weight_decay: 0.01
warmup_epochs: 3
workers: 2
project: checkpoints
seed: 42
